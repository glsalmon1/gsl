<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#F5F5F5"
  >

  <meta
    name="description"
    content="sundries"
  >

  <title>gsl.mn</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="./assets/graphics/link-1.svg"
  >

  <link
    rel="stylesheet"
    href="./styles.css"
  >
</head>


<body>

  <a
    class="skip-link"
    href="#links"
  >
    Skip to links
  </a>


  <main>

    <!--
      Site title remains available to screen readers/search engines,
      but is NOT visually displayed.
    -->
    <h1 class="visually-hidden">
      gsl.mn
    </h1>


    <!-- =====================================================
         LARGE HERO SVG
         ===================================================== -->

    <section class="hero">

      <img
        class="hero__art"
        src="./assets/graphics/basalSVGcircumnutation.svg"
        alt=""
      >


      <!--
        Invisible clickable region centered over the hero.

        Change href to whatever you want.

        Nothing visible is drawn here.
        Remove this <a> entirely if you don't want
        the hero to contain a link.
      -->
      <!-- <a
        class="hero__center-link"
        href="./about/"
        aria-label="About"
      ></a> -->

    </section>



    <!-- =====================================================
         TWO FULL-WIDTH LINK BANDS
         ===================================================== -->

    <nav
      class="links"
      id="links"
      aria-label="Explore"
    >


      <!-- FIRST LINK -->

      <div class="link-band link-band--red">

        <a
          class="illustrated-link illustrated-link--red"
          href="https://thesis.caltech.edu/18607/"
        >

          <img
            class="illustrated-link__art"
            src="./assets/graphics/cubveTrees.svg"
            alt=""
          >

          <span class="illustrated-link__label">
            thesis↗
          </span>

        </a>

      </div>



      <!-- SECOND LINK -->

      <div class="link-band link-band--blue">

        <a
          class="illustrated-link illustrated-link--blue"
          href="https://www.nitmb.org/event/curiosity-driven-dialogue-and-collaboration-between-experiment-and-theory-2/"
        >

          <img
            class="illustrated-link__art"
            src="./assets/graphics/2027curiosity.svg"
            alt=""
          >

          <span class="illustrated-link__label">
            2027 workshop↗
          </span>

        </a>

      </div>


    </nav>

  </main>


</body>
</html>
